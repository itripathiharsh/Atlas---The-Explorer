<!-- BEGIN: Custom Map & Hex Styling & Micro-animations -->
<style data-purpose="hexagonal-grid-layout">
    /* Hexagon clip-path shape */
    .hex-cell {
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    /* Radar pulse ring animations */
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 0.9; }
      50% { opacity: 0.45; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    @keyframes pulse-ring-delayed {
      0% { transform: scale(0.6); opacity: 0.8; }
      50% { opacity: 0.3; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    
    .ping-ring {
      animation: pulse-ring 2.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .ping-ring-delayed {
      animation: pulse-ring-delayed 2.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.2s;
    }

    /* Radar scanline shimmer across active sector */
    @keyframes radar-sweep {
      0% { transform: rotate(0deg); opacity: 0.25; }
      50% { opacity: 0.45; }
      100% { transform: rotate(360deg); opacity: 0.25; }
    }

    .radar-sweep-effect {
      animation: radar-sweep 8s linear infinite;
    }

    /* Ambient fog and mist drifting keyframes */
    @keyframes fog-drift-1 {
      0% { transform: translate(-8%, -5%) scale(1); opacity: 0.45; }
      50% { transform: translate(6%, 8%) scale(1.08); opacity: 0.65; }
      100% { transform: translate(-8%, -5%) scale(1); opacity: 0.45; }
    }
    @keyframes fog-drift-2 {
      0% { transform: translate(5%, 6%) scale(1.05); opacity: 0.4; }
      50% { transform: translate(-6%, -6%) scale(0.95); opacity: 0.6; }
      100% { transform: translate(5%, 6%) scale(1.05); opacity: 0.4; }
    }

    .fog-mist-layer-1 {
      animation: fog-drift-1 16s ease-in-out infinite alternate;
    }
    .fog-mist-layer-2 {
      animation: fog-drift-2 22s ease-in-out infinite alternate;
    }

    /* Breathing glow effect on unlocked tiles */
    @keyframes subtle-breath {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(56, 178, 132, 0.35)); }
      50% { filter: drop-shadow(0 0 7px rgba(56, 178, 132, 0.65)); }
    }
    .hex-glow-pulse {
      animation: subtle-breath 4s ease-in-out infinite;
    }

    /* Shake animation for locked hex tiles */
    @keyframes lock-rattle {
      0%, 100% { transform: translate(0, 0) scale(1); }
      20% { transform: translate(-3px, 1px) scale(0.98); }
      40% { transform: translate(3px, -1px) scale(1.01); }
      60% { transform: translate(-2px, -1px) scale(0.99); }
      80% { transform: translate(2px, 1px) scale(1.01); }
    }
    .shake-animation {
      animation: lock-rattle 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Hexagon selected elevation */
    .hex-cell.active-tile {
      transform: scale(1.08) translateY(-4px) !important;
      filter: drop-shadow(0 10px 18px rgba(56, 178, 132, 0.55)) drop-shadow(0 0 8px rgba(56, 178, 132, 0.8));
      z-index: 25 !important;
    }

    /* Fog effect gradient */
    .fog-gradient {
      background: radial-gradient(circle at 50% 48%, rgba(7, 23, 20, 0) 25%, rgba(7, 23, 20, 0.75) 60%, rgba(7, 23, 20, 0.98) 100%);
    }

    /* Interactive button press micro-spring */
    .interactive-btn {
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.25s ease;
    }
    .interactive-btn:active {
      transform: scale(0.88);
    }

    /* Accessibility: Reduced motion overrides */
    @media (prefers-reduced-motion: reduce) {
      .ping-ring, .ping-ring-delayed, .radar-sweep-effect, .fog-mist-layer-1, .fog-mist-layer-2, .hex-glow-pulse, .shake-animation {
        animation: none !important;
      }
      .hex-cell {
        transition: none !important;
      }
    }
  </style>
<!-- END: Custom Map & Hex Styling & Micro-animations -->

<!-- Interactive Logic for Hex Selection, Lock Shakes, Tooltips and Floating Controls -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const tooltip = document.getElementById('tileTooltip');
    const tooltipTitle = document.getElementById('tooltipTitle');
    const tooltipDesc = document.getElementById('tooltipDesc');
    const tooltipIcon = document.getElementById('tooltipIcon');
    const tooltipIconWrap = document.getElementById('tooltipIconWrap');
    let tooltipTimeout;

    function showTooltip(title, desc, isLocked) {
      clearTimeout(tooltipTimeout);
      tooltipTitle.textContent = title;
      tooltipDesc.textContent = desc;
      
      if (isLocked) {
        tooltipIconWrap.className = "w-6 h-6 rounded-full bg-red-950/60 border border-red-500/40 flex items-center justify-center flex-shrink-0";
        tooltipIcon.setAttribute('class', 'w-3.5 h-3.5 text-red-400');
        tooltipIcon.innerHTML = '<path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>';
      } else {
        tooltipIconWrap.className = "w-6 h-6 rounded-full bg-emerald-950/80 border border-accent-lightgreen/50 flex items-center justify-center flex-shrink-0";
        tooltipIcon.setAttribute('class', 'w-3.5 h-3.5 text-accent-lightgreen');
        tooltipIcon.innerHTML = '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>';
      }

      tooltip.classList.remove('opacity-0', 'translate-y-3');
      tooltip.classList.add('opacity-100', 'translate-y-0');

      tooltipTimeout = setTimeout(() => {
        tooltip.classList.add('opacity-0', 'translate-y-3');
        tooltip.classList.remove('opacity-100', 'translate-y-0');
      }, 3400);
    }

    // Locked Hexagon interactions (Shake ripple & cue)
    const lockedTiles = document.querySelectorAll('.hex-locked');
    lockedTiles.forEach(tile => {
      tile.addEventListener('click', (e) => {
        e.stopPropagation();
        tile.classList.remove('shake-animation');
        void tile.offsetWidth; // Force re-render
        tile.classList.add('shake-animation');

        const name = tile.getAttribute('data-name') || 'Unexplored Territory';
        const req = tile.getAttribute('data-req') || 'Requires higher level or proximity';
        showTooltip(name + ' (Fog of War)', req, true);
      });
    });

    // Unlocked Hexagon interactions (Elevation highlight & active status)
    const allHexes = document.querySelectorAll('.hex-cell');
    const unlockedTiles = document.querySelectorAll('.hex-unlocked');
    unlockedTiles.forEach(tile => {
      tile.addEventListener('click', (e) => {
        e.stopPropagation();
        allHexes.forEach(h => h.classList.remove('active-tile'));
        tile.classList.add('active-tile');

        const name = tile.getAttribute('data-name') || 'Unlocked Sector';
        const detail = tile.getAttribute('data-detail') || 'Waypoint active';
        showTooltip(name, detail, false);
      });
    });

    // Compass Button rotation effect
    const compassBtn = document.getElementById('compassBtn');
    const compassIcon = document.getElementById('compassIcon');
    let compassHeading = -45;
    if (compassBtn && compassIcon) {
      compassBtn.addEventListener('click', () => {
        compassHeading = compassHeading === 0 ? -45 : 0;
        compassIcon.style.transform = `rotate(${compassHeading}deg)`;
        showTooltip(compassHeading === 0 ? "Facing True North (0°)" : "Oriented to Ridge Heading (315°)", "Compass aligned", false);
      });
    }

    // Recenter GPS button action
    const recenterBtn = document.getElementById('recenterBtn');
    const currentHex = document.getElementById('currentLocationHex');
    if (recenterBtn && currentHex) {
      recenterBtn.addEventListener('click', () => {
        allHexes.forEach(h => h.classList.remove('active-tile'));
        currentHex.classList.add('active-tile');
        showTooltip("Sunset Ridge", "Recentered onto live GPS beacon", false);
      });
    }

    // Layers button feedback
    const layersBtn = document.getElementById('layersBtn');
    if (layersBtn) {
      layersBtn.addEventListener('click', () => {
        showTooltip("Topographic Layer Active", "Showing contour & river lines (10m intervals)", false);
      });
    }
  });
</script>
