<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ATLAS - Achievements</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            atlas: {
              bg: '#EFECE6',
              card: '#F8F6F2',
              forest: '#1E3A2B',
              forestDark: '#12261C',
              sage: '#2D5A43',
              muted: '#7A847C',
              gold: '#D4A346',
              goldDark: '#8A5D19',
              goldBorder: '#E5C07B',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Badge and Layout Styles -->
<style data-purpose="custom-badges">
    /* Hexagonal badge mask clip path */
    .hex-shape {
      clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    }
    
    /* Subtle bottom border highlight effect on glass-like badge */
    .hex-inner-shadow {
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -2px 6px rgba(0, 0, 0, 0.25);
    }
    
    /* Hide native scrollbars for horizontal filter chips */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<!-- END: Custom Badge and Layout Styles -->
</head>
<body class="bg-[#EFECE6] text-atlas-forest font-sans antialiased flex justify-center items-center min-h-screen p-0 sm:p-4 select-none">
<!-- BEGIN: Mobile Frame Container -->
<div class="w-full max-w-[420px] h-[890px] bg-[#EFECE6] shadow-2xl relative flex flex-col overflow-hidden sm:rounded-[44px] border-0 sm:border-[8px] sm:border-[#1E2521]">
<!-- BEGIN: iOS Status Bar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-30 shrink-0 text-atlas-forest select-none">
<span class="text-sm font-semibold tracking-tight">9:41</span>
<div class="flex items-center gap-1.5">
<!-- Signal Indicator -->
<svg class="w-4 h-3 fill-current" viewbox="0 0 17 11">
<rect height="3" rx="0.8" width="3" x="0" y="8"></rect>
<rect height="5.5" rx="0.8" width="3" x="4.5" y="5.5"></rect>
<rect height="8" rx="0.8" width="3" x="9" y="3"></rect>
<rect height="11" rx="0.8" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3 fill-current" viewbox="0 0 16 12">
<path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-4.2-3.1a6.02 6.02 0 0 1 8.4 0 .9.9 0 0 0 1.27-1.27 7.82 7.82 0 0 0-10.94 0 .9.9 0 1 0 1.27 1.27zm-2.8-2.8a10.02 10.02 0 0 1 14 0 .9.9 0 0 0 1.27-1.27 11.82 11.82 0 0 0-16.54 0 .9.9 0 0 0 1.27 1.27z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-current rounded-[4px] p-0.5 flex items-center">
<div class="h-full w-full bg-current rounded-[1.5px]"></div>
</div>
</div>
</header>
<!-- END: iOS Status Bar -->
<!-- BEGIN: Achievements Header & Filter Chips -->
<section class="px-6 pt-5 pb-2 shrink-0">
<!-- Title Area -->
<div class="flex items-center justify-between mb-4">
<h1 class="text-2xl font-bold text-[#162E20] tracking-tight">Achievements</h1>
<div class="bg-[#E4E0D7] px-2.5 py-1 rounded-full text-xs font-semibold text-atlas-forest flex items-center gap-1 shadow-sm">
<span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span>
<span>6 / 24</span>
</div>
</div>
<!-- Horizontal Filter Pills -->
<nav aria-label="Achievement Category Filter" class="flex space-x-2 overflow-x-auto no-scrollbar pb-1 text-xs font-medium">
<button class="px-4 py-1.5 rounded-full bg-[#1A3828] text-white shadow-sm font-semibold whitespace-nowrap transition-transform active:scale-95">All</button>
<button class="px-4 py-1.5 rounded-full bg-[#E5E1D8] text-atlas-forest hover:bg-[#DDD8CD] whitespace-nowrap transition-colors">Exploration</button>
<button class="px-4 py-1.5 rounded-full bg-[#E5E1D8] text-atlas-forest hover:bg-[#DDD8CD] whitespace-nowrap transition-colors">Special</button>
<button class="px-4 py-1.5 rounded-full bg-[#E5E1D8] text-atlas-forest hover:bg-[#DDD8CD] whitespace-nowrap transition-colors">Social</button>
</nav>
</section>
<!-- END: Achievements Header & Filter Chips -->
<!-- BEGIN: Badges Grid Area -->
<main class="flex-1 overflow-y-auto px-6 py-2 no-scrollbar">
<div class="grid grid-cols-2 gap-3.5 pb-6">
<!-- Card 1: First Step -->
<article class="bg-[#F6F4EE] rounded-2xl p-4 flex flex-col items-center text-center shadow-[0_3px_12px_rgba(0,0,0,0.04)] border border-[#E6E1D5] transition-transform active:scale-[0.98]">
<!-- Hex Badge Wrapper -->
<div class="relative w-20 h-20 mb-3 flex items-center justify-center">
<!-- Outer Hexagon Border Layer -->
<div class="absolute inset-0 bg-gradient-to-br from-[#E2B75B] via-[#C9922C] to-[#8C5D14] hex-shape p-[2.5px] drop-shadow-md">
<!-- Inner Badge Surface -->
<div class="w-full h-full bg-gradient-to-b from-[#1C372A] to-[#12231A] hex-shape flex items-center justify-center relative hex-inner-shadow">
<!-- Golden Path / Footprint Emblem -->
<svg class="w-8 h-8 text-[#E6BF68]" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"></path>
</svg>
<!-- Badge Sheen Effect -->
<div class="absolute inset-x-1 top-1 h-3 bg-white/10 rounded-full blur-[1px]"></div>
</div>
</div>
</div>
<h3 class="text-sm font-bold text-[#142B1F] tracking-tight">First Step</h3>
<p class="text-[11px] text-atlas-muted mt-1 leading-snug">Visit your first place</p>
</article>
<!-- Card 2: Explorer -->
<article class="bg-[#F6F4EE] rounded-2xl p-4 flex flex-col items-center text-center shadow-[0_3px_12px_rgba(0,0,0,0.04)] border border-[#E6E1D5] transition-transform active:scale-[0.98]">
<!-- Hex Badge Wrapper -->
<div class="relative w-20 h-20 mb-3 flex items-center justify-center">
<div class="absolute inset-0 bg-gradient-to-br from-[#40A86A] via-[#246A3F] to-[#134426] hex-shape p-[2.5px] drop-shadow-md">
<div class="w-full h-full bg-gradient-to-b from-[#1C372A] to-[#10241A] hex-shape flex items-center justify-center relative hex-inner-shadow">
<!-- Compass / Star Icon -->
<svg class="w-8 h-8 text-[#54CD84]" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2L14.7 9.3L22 12L14.7 14.7L12 22L9.3 14.7L2 12L9.3 9.3L12 2Z"></path>
</svg>
<div class="absolute inset-x-1 top-1 h-3 bg-white/10 rounded-full blur-[1px]"></div>
</div>
</div>
</div>
<h3 class="text-sm font-bold text-[#142B1F] tracking-tight">Explorer</h3>
<p class="text-[11px] text-atlas-muted mt-1 leading-snug">Visit 10 places</p>
</article>
<!-- Card 3: City Wanderer -->
<article class="bg-[#F6F4EE] rounded-2xl p-4 flex flex-col items-center text-center shadow-[0_3px_12px_rgba(0,0,0,0.04)] border border-[#E6E1D5] transition-transform active:scale-[0.98]">
<!-- Hex Badge Wrapper -->
<div class="relative w-20 h-20 mb-3 flex items-center justify-center">
<div class="absolute inset-0 bg-gradient-to-br from-[#5396DC] via-[#2860A0] to-[#163861] hex-shape p-[2.5px] drop-shadow-md">
<div class="w-full h-full bg-gradient-to-b from-[#182C3D] to-[#0E1A25] hex-shape flex items-center justify-center relative hex-inner-shadow">
<!-- City skyline / building mark -->
<svg class="w-8 h-8 text-[#67ABF7]" fill="currentColor" viewbox="0 0 24 24">
<path d="M15 11V5l-5-2-5 2v6H2v10h20V11h-7zm-8 7H5v-2h2v2zm0-4H5v-2h2v2zm4 4H9v-2h2v2zm0-4H9v-2h2v2zm0-4H9V8h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm4 4h-2v-2h2v2zm0-4h-2v-2h2v2z"></path>
</svg>
<div class="absolute inset-x-1 top-1 h-3 bg-white/10 rounded-full blur-[1px]"></div>
</div>
</div>
</div>
<h3 class="text-sm font-bold text-[#142B1F] tracking-tight">City Wanderer</h3>
<p class="text-[11px] text-atlas-muted mt-1 leading-snug">Visit 5 cities</p>
</article>
<!-- Card 4: Nature Lover -->
<article class="bg-[#F6F4EE] rounded-2xl p-4 flex flex-col items-center text-center shadow-[0_3px_12px_rgba(0,0,0,0.04)] border border-[#E6E1D5] transition-transform active:scale-[0.98]">
<!-- Hex Badge Wrapper -->
<div class="relative w-20 h-20 mb-3 flex items-center justify-center">
<div class="absolute inset-0 bg-gradient-to-br from-[#68BF6E] via-[#2F8538] to-[#1A5722] hex-shape p-[2.5px] drop-shadow-md">
<div class="w-full h-full bg-gradient-to-b from-[#1C372A] to-[#10241A] hex-shape flex items-center justify-center relative hex-inner-shadow">
<!-- Botanical Leaf & Mountain Emblem -->
<svg class="w-8 h-8 text-[#76E17E]" fill="currentColor" viewbox="0 0 24 24">
<path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3c2.72.18 5.64-.53 8.16-2.14 3.79-2.42 5.09-6.49 5.13-9.56-.66.66-2.32 1.66-4.5 1.83C18.23 8.35 17 8 17 8z"></path>
</svg>
<div class="absolute inset-x-1 top-1 h-3 bg-white/10 rounded-full blur-[1px]"></div>
</div>
</div>
</div>
<h3 class="text-sm font-bold text-[#142B1F] tracking-tight">Nature Lover</h3>
<p class="text-[11px] text-atlas-muted mt-1 leading-snug">Visit 20 nature spots</p>
</article>
<!-- Card 5: Peak Seeker -->
<article class="bg-[#F6F4EE] rounded-2xl p-4 flex flex-col items-center text-center shadow-[0_3px_12px_rgba(0,0,0,0.04)] border border-[#E6E1D5] transition-transform active:scale-[0.98]">
<!-- Hex Badge Wrapper -->
<div class="relative w-20 h-20 mb-3 flex items-center justify-center">
<div class="absolute inset-0 bg-gradient-to-br from-[#E2B75B] via-[#C9922C] to-[#8C5D14] hex-shape p-[2.5px] drop-shadow-md">
<div class="w-full h-full bg-gradient-to-b from-[#1C372A] to-[#12231A] hex-shape flex items-center justify-center relative hex-inner-shadow">
<!-- Twin Mountain Peaks -->
<svg class="w-8 h-8 text-[#E6BF68]" fill="currentColor" viewbox="0 0 24 24">
<path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2L6 8 1 15h22L14 6z"></path>
</svg>
<div class="absolute inset-x-1 top-1 h-3 bg-white/10 rounded-full blur-[1px]"></div>
</div>
</div>
</div>
<h3 class="text-sm font-bold text-[#142B1F] tracking-tight">Peak Seeker</h3>
<p class="text-[11px] text-atlas-muted mt-1 leading-snug">Reach 3000m altitude</p>
</article>
<!-- Card 6: Trailblazer -->
<article class="bg-[#F6F4EE] rounded-2xl p-4 flex flex-col items-center text-center shadow-[0_3px_12px_rgba(0,0,0,0.04)] border border-[#E6E1D5] transition-transform active:scale-[0.98]">
<!-- Hex Badge Wrapper -->
<div class="relative w-20 h-20 mb-3 flex items-center justify-center">
<div class="absolute inset-0 bg-gradient-to-br from-[#B57AED] via-[#7B3AC2] to-[#45167E] hex-shape p-[2.5px] drop-shadow-md">
<div class="w-full h-full bg-gradient-to-b from-[#251D3A] to-[#140E22] hex-shape flex items-center justify-center relative hex-inner-shadow">
<!-- Royal Star & Crown / Trophy Star -->
<svg class="w-8 h-8 text-[#CFA7FF]" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path>
</svg>
<div class="absolute inset-x-1 top-1 h-3 bg-white/10 rounded-full blur-[1px]"></div>
</div>
</div>
</div>
<h3 class="text-sm font-bold text-[#142B1F] tracking-tight">Trailblazer</h3>
<p class="text-[11px] text-atlas-muted mt-1 leading-snug">Unlock 50 locations</p>
</article>
</div>
</main>
<!-- END: Badges Grid Area -->
<!-- BEGIN: Bottom Tab Navigation Bar -->
<nav class="bg-[#FBF9F4] border-t border-[#E5E0D5] px-4 pt-2.5 pb-6 shrink-0 flex justify-around items-center z-20">
<!-- 1. Home / Map -->
<a class="flex flex-col items-center text-[#738075] hover:text-[#183625] transition-colors" href="#">
<svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium">Home</span>
</a>
<!-- 2. Explore -->
<a class="flex flex-col items-center text-[#738075] hover:text-[#183625] transition-colors" href="#">
<svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium">Explore</span>
</a>
<!-- 3. Add / Check-In Action Button -->
<button class="relative -top-3 w-12 h-12 rounded-full bg-[#183827] text-white shadow-lg flex items-center justify-center transition-transform active:scale-90 border-2 border-[#EFECE6]">
<svg class="w-6 h-6 stroke-current stroke-[2.5]" fill="none" viewbox="0 0 24 24">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- 4. Social -->
<a class="flex flex-col items-center text-[#738075] hover:text-[#183625] transition-colors" href="#">
<svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium">Social</span>
</a>
<!-- 5. Profile / Achievements (Active) -->
<a class="flex flex-col items-center text-[#183827] font-semibold" href="#">
<svg class="w-5 h-5 mb-0.5 fill-current" viewbox="0 0 24 24">
<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
</svg>
<span class="text-[10px] font-bold">Profile</span>
</a>
</nav>
<!-- END: Bottom Tab Navigation Bar -->
<!-- BEGIN: iOS Bottom Home Bar Indicator -->
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-[#1A261E]/30 rounded-full pointer-events-none"></div>
<!-- END: iOS Bottom Home Bar Indicator -->
</div>
<!-- END: Mobile Frame Container -->
</body></html>
