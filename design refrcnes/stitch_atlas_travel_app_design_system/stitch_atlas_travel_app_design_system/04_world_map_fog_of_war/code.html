<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

<!-- Load Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Custom Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              950: '#050f0d',
              900: '#071714',
              850: '#0a1e1a',
              800: '#0e2621',
              700: '#153b34',
              600: '#1f5349',
              500: '#2b7164',
            },
            accent: {
              green: '#20775a',
              lightgreen: '#38b284',
              cream: '#e9e3d5',
              sand: '#d5cbba',
              gold: '#eab308'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }

<!-- BEGIN: Custom Map & Hex Styling -->
<style data-purpose="hexagonal-grid-layout">
    /* Hexagon clip-path shape */
    .hex-cell {
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Subtle pulsing effect for current user location dot */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.4); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.85; }
    }
    
    .ping-ring {
      animation: pulse-ring 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    /* Fog effect gradient */
    .fog-gradient {
      background: radial-gradient(circle at 50% 48%, rgba(7, 23, 20, 0) 25%, rgba(7, 23, 20, 0.75) 60%, rgba(7, 23, 20, 0.98) 100%);
    }

    /* Hexagon border simulation */
    .hex-border {
      filter: drop-shadow(0 0 1px rgba(56, 178, 132, 0.35));
    }
  </style>
<!-- END: Custom Map & Hex Styling -->
</head>
<body class="bg-black flex justify-center items-center min-h-screen p-0 m-0 antialiased font-sans select-none overflow-hidden">

<!-- BEGIN: iOS Status Bar -->
<header class="relative z-30 pt-3 px-7 flex justify-between items-center text-xs font-semibold tracking-tight text-accent-cream/90" data-purpose="ios-status-bar">
<span>9:41</span>

<div class="w-24 h-4 bg-black/60 backdrop-blur-md rounded-full -mt-1"></div>
<div class="flex items-center space-x-1.5">

<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0012 4zm0 3c3.75 0 7.18 1.43 9.77 3.79L12 18.66 2.23 10.79C4.82 8.43 8.25 7 12 7z"></path></svg>

<div class="h-full w-3.5 bg-accent-cream rounded-[1px]"></div>

<!-- BEGIN: Top Navigation & User Header -->

<span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-accent-lightgreen border-2 border-forest-900 rounded-full flex items-center justify-center text-[7px] font-bold text-forest-950">✓</span>

<!-- BEGIN: Central Viewport / Hexagonal Fog of War Map -->

<!-- Hex 4 - Middle Far-Right Locked -->
<div class="hex-cell absolute top-32 -right-2 w-24 h-28 bg-forest-950/95 border border-forest-800/40 opacity-75 flex items-center justify-center">

<!-- Center Unlocked Core Cluster (Rich Terrains & POIs) -->
