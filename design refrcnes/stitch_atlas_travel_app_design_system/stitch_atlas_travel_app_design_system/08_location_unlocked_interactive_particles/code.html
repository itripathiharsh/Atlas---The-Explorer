<style data-purpose="custom-effects">
    /* Hexagonal clip-path shape */
    .hexagon-shape {
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    /* Ambient pulse & glow animations */
    @keyframes pulse-subtle {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.95; transform: translate(-50%, -50%) scale(1.1); }
    }

    @keyframes rotate-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes float-levitate {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    @keyframes gleam-sweep {
      0% { transform: translateX(-150%) skewX(-20deg); }
      50%, 100% { transform: translateX(250%) skewX(-20deg); }
    }

    @keyframes ripple-wave {
      0% { transform: scale(0.2); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .ambient-glow {
      animation: pulse-subtle 4.5s ease-in-out infinite;
    }

    .badge-levitate {
      animation: float-levitate 5s ease-in-out infinite;
    }

    .rotating-sunburst {
      animation: rotate-slow 35s linear infinite;
    }

    /* Gleam shimmer effect */
    .gleam-effect::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 235, 175, 0.45), transparent);
      animation: gleam-sweep 3.8s ease-in-out infinite;
      pointer-events: none;
    }

    /* Spring bounce micro-interaction */
    .badge-spring {
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .badge-spring:active {
      transform: scale(0.94);
    }

    /* Fine golden particle sparkle simulation */
    .gold-radial-light {
      background: radial-gradient(circle at center, rgba(235, 175, 65, 0.48) 0%, rgba(200, 140, 40, 0.2) 45%, rgba(7, 23, 20, 0) 70%);
    }

    /* Shockwave circle styling */
    .shockwave-ring {
      position: absolute;
      border-radius: 9999px;
      pointer-events: none;
      border: 2px solid rgba(250, 214, 123, 0.85);
      box-shadow: 0 0 20px rgba(229, 169, 60, 0.6);
      transform: translate(-50%, -50%);
      animation: ripple-wave 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient-glow, .badge-levitate, .rotating-sunburst, .gleam-effect::after {
        animation: none !important;
      }
      .badge-spring {
        transition: none !important;
      }
    }
  </style>
</head>

<!-- Particle Engine and Interactive Effects Script -->
<script data-purpose="motion-celebration-engine">
  (function () {
    const container = document.getElementById('mobileContainer');
    const canvas = document.getElementById('particleCanvas');
    if (!canvas || !container) return;
    const ctx = canvas.getContext('2d');

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let width = 0;
    let height = 0;
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Particle arrays
    const ambientParticles = [];
    const burstParticles = [];

    const GOLD_COLORS = [
      '#FAD67B', // gold-light
      '#E5A93C', // atlas-gold
      '#FFD166', // warm radiant
      '#FFF4D2', // sparkle white-gold
      '#CCA830', // deep amber
      '#94D4B2'  // soft emerald glimmer
    ];

    // Seed ambient drifting luminous embers
    const AMBIENT_COUNT = reducedMotion ? 8 : 28;
    for (let i = 0; i < AMBIENT_COUNT; i++) {
      ambientParticles.push({
        x: Math.random() * (width || 390),
        y: Math.random() * (height || 844),
        radius: Math.random() * 1.8 + 0.6,
        alpha: Math.random() * 0.7 + 0.2,
        speedY: -(Math.random() * 0.45 + 0.15),
        speedX: (Math.random() - 0.5) * 0.3,
        twinkleSpeed: Math.random() * 0.03 + 0.015,
        twinkleOffset: Math.random() * Math.PI * 2,
        color: GOLD_COLORS[Math.floor(Math.random() * 4)]
      });
    }

    // Spawn shockwave ring DOM element
    function spawnShockwave(x, y, scale = 1) {
      if (reducedMotion) return;
      const ring = document.createElement('div');
      ring.className = 'shockwave-ring';
      const size = Math.floor(110 * scale);
      ring.style.width = size + 'px';
      ring.style.height = size + 'px';
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      container.appendChild(ring);
      setTimeout(() => ring.remove(), 850);
    }

    // Dynamic celebration burst at (x, y)
    function createCelebrationBurst(x, y, count = 45, power = 1) {
      if (reducedMotion) return;
      spawnShockwave(x, y, power);

      const shardCount = Math.floor(count * power);
      for (let i = 0; i < shardCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = (Math.random() * 4.8 + 1.8) * power;
        const type = Math.random() > 0.45 ? 'shard' : 'spark'; // geometric shard or round glowing spark

        burstParticles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * velocity + (Math.random() - 0.5) * 0.8,
          vy: Math.sin(angle) * velocity - (Math.random() * 1.5 + 0.5),
          gravity: 0.12,
          drag: 0.965,
          color: GOLD_COLORS[Math.floor(Math.random() * GOLD_COLORS.length)],
          alpha: 1,
          decay: Math.random() * 0.018 + 0.012,
          size: type === 'shard' ? (Math.random() * 5 + 3) : (Math.random() * 3 + 1.2),
          type: type,
          rotation: Math.random() * Math.PI * 2,
          vRotation: (Math.random() - 0.5) * 0.22
        });
      }
    }

    // Animation Loop
    let lastTime = performance.now();

    function renderLoop(time) {
      const delta = Math.min((time - lastTime) / 16.66, 2.5);
      lastTime = time;

      ctx.clearRect(0, 0, width, height);

      // Render & update ambient floating particles
      for (let i = 0; i < ambientParticles.length; i++) {
        const p = ambientParticles[i];
        p.y += p.speedY * delta;
        p.x += p.speedX * delta;
        p.twinkleOffset += p.twinkleSpeed * delta;

        // Wrap around boundaries
        if (p.y < -10) p.y = height + 10;
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;

        const currentAlpha = Math.max(0.1, p.alpha * (0.65 + 0.35 * Math.sin(p.twinkleOffset)));

        ctx.save();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = currentAlpha;
        ctx.shadowBlur = 6;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Render & update celebration burst particles
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const bp = burstParticles[i];
        bp.vx *= bp.drag;
        bp.vy *= bp.drag;
        bp.vy += bp.gravity * delta;
        bp.x += bp.vx * delta;
        bp.y += bp.vy * delta;
        bp.rotation += bp.vRotation * delta;
        bp.alpha -= bp.decay * delta;

        if (bp.alpha <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(bp.x, bp.y);
        ctx.rotate(bp.rotation);
        ctx.fillStyle = bp.color;
        ctx.globalAlpha = Math.max(0, bp.alpha);
        ctx.shadowBlur = 8;
        ctx.shadowColor = bp.color;

        if (bp.type === 'shard') {
          // Draw diamond / angular confetti shard
          const w = bp.size;
          const h = bp.size * 0.65;
          ctx.beginPath();
          ctx.moveTo(0, -h);
          ctx.lineTo(w, 0);
          ctx.lineTo(0, h);
          ctx.lineTo(-w, 0);
          ctx.closePath();
          ctx.fill();
        } else {
          // Glow spark
          ctx.beginPath();
          ctx.arc(0, 0, bp.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }

    requestAnimationFrame(renderLoop);

    // Initial Grand Celebration on Load radiating from hexagon badge center
    function launchInitialBurst() {
      const badge = document.getElementById('badgeTarget');
      if (badge) {
        const cRect = container.getBoundingClientRect();
        const bRect = badge.getBoundingClientRect();
        const centerX = (bRect.left + bRect.width / 2) - cRect.left;
        const centerY = (bRect.top + bRect.height / 2) - cRect.top;

        // Radiate two successive celebration rings
        createCelebrationBurst(centerX, centerY, 55, 1.25);
        setTimeout(() => {
          createCelebrationBurst(centerX, centerY, 35, 0.9);
        }, 220);
      }
    }

    // Trigger initial celebration after quick delay
    setTimeout(launchInitialBurst, 350);

    // Helper to get touch/mouse coordinates relative to container
    function getContainerCoords(e) {
      const rect = container.getBoundingClientRect();
      const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // Interaction 1: Tap on Hexagon Badge
    const badgeTarget = document.getElementById('badgeTarget');
    if (badgeTarget) {
      badgeTarget.addEventListener('pointerdown', (e) => {
        const coords = getContainerCoords(e);
        createCelebrationBurst(coords.x, coords.y, 45, 1.15);
      });
    }

    // Interaction 2: Tap on XP Badge
    const xpBadgeTarget = document.getElementById('xpBadgeTarget');
    if (xpBadgeTarget) {
      xpBadgeTarget.addEventListener('pointerdown', (e) => {
        const coords = getContainerCoords(e);
        createCelebrationBurst(coords.x, coords.y, 32, 0.95);
      });
    }

    // Interaction 3: Tap anywhere on screen background
    container.addEventListener('pointerdown', (e) => {
      // Don't duplicate if already target element handled
      if (e.target.closest('#badgeTarget') || e.target.closest('#xpBadgeTarget') || e.target.closest('button')) {
        return;
      }
      const coords = getContainerCoords(e);
      createCelebrationBurst(coords.x, coords.y, 22, 0.7);
    });

    // Tactile button ripple helper
    function attachRippleEffect(button, rippleColor = 'rgba(255, 255, 255, 0.35)') {
      button.addEventListener('pointerdown', function (e) {
        const rect = button.getBoundingClientRect();
        const ripple = document.createElement('span');
        const diameter = Math.max(rect.width, rect.height);
        const radius = diameter / 2;

        const x = (e.clientX || (rect.left + rect.width / 2)) - rect.left - radius;
        const y = (e.clientY || (rect.top + rect.height / 2)) - rect.top - radius;

        ripple.style.position = 'absolute';
        ripple.style.width = ripple.style.height = `${diameter}px`;
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        ripple.style.borderRadius = '50%';
        ripple.style.backgroundColor = rippleColor;
        ripple.style.transform = 'scale(0)';
        ripple.style.animation = 'ripple-wave 0.65s ease-out forwards';
        ripple.style.pointerEvents = 'none';

        button.appendChild(ripple);
        setTimeout(() => ripple.remove(), 700);

        // Small spark burst near button click
        const cRect = container.getBoundingClientRect();
        const ptX = (e.clientX || (rect.left + rect.width / 2)) - cRect.left;
        const ptY = (e.clientY || (rect.top + rect.height / 2)) - cRect.top;
        createCelebrationBurst(ptX, ptY, 14, 0.6);
      });
    }

    const btnViewMap = document.getElementById('btnViewMap');
    const btnShare = document.getElementById('btnShare');
    const closeBtn = document.getElementById('closeBtn');

    if (btnViewMap) attachRippleEffect(btnViewMap, 'rgba(19, 40, 34, 0.2)');
    if (btnShare) attachRippleEffect(btnShare, 'rgba(255, 255, 255, 0.25)');

    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        container.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
        container.style.opacity = '0.4';
        container.style.transform = 'scale(0.97)';
        setTimeout(() => {
          container.style.opacity = '1';
          container.style.transform = 'scale(1)';
        }, 600);
      });
    }
  })();
</script>
</body></html>
