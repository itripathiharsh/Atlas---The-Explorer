<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ATLAS - Check-in Verification</title>
<!-- Load Tailwind CSS v3 with forms & container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            atlas: {
              dark: '#0f2020',
              forest: '#1f5b4e',
              emerald: '#277a68',
              beige: '#e8ded0',
              cream: '#f8f5ee',
              card: '#162b29'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'SF Pro Display', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Viewfinder Styles -->
<style data-purpose="camera-viewfinder-overlay">
    /* Camera viewfinder background mimicking scenic mountain valley landscape */
    .viewfinder-bg {
      background-image: 
        linear-gradient(180deg, rgba(15, 32, 32, 0.45) 0%, rgba(15, 32, 32, 0.1) 30%, rgba(15, 32, 32, 0.25) 70%, rgba(15, 32, 32, 0.85) 100%),
        radial-gradient(ellipse at 50% 30%, rgba(254, 215, 170, 0.25) 0%, transparent 60%),
        linear-gradient(135deg, #1b383d 0%, #2a4843 25%, #46605a 50%, #2b3d39 80%, #152220 100%);
      background-size: cover;
      background-position: center;
    }

    /* Reticle corner borders */
    .reticle-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: rgba(255, 255, 255, 0.85);
      border-style: solid;
      pointer-events: none;
    }
    .reticle-top-left {
      top: 0;
      left: 0;
      border-width: 2px 0 0 2px;
      border-top-left-radius: 8px;
    }
    .reticle-top-right {
      top: 0;
      right: 0;
      border-width: 2px 2px 0 0;
      border-top-right-radius: 8px;
    }
    .reticle-bottom-left {
      bottom: 0;
      left: 0;
      border-width: 0 0 2px 2px;
      border-bottom-left-radius: 8px;
    }
    .reticle-bottom-right {
      bottom: 0;
      right: 0;
      border-width: 0 2px 2px 0;
      border-bottom-right-radius: 8px;
    }

    /* Subtle pulse animation for status indicator */
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-ring {
      animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
<!-- END: Custom Viewfinder Styles -->
</head>
<body class="bg-black text-white flex justify-center items-center min-h-screen p-0 sm:p-4 select-none">
<!-- BEGIN: Phone Mockup Container (Mobile iOS Frame) -->
<main class="relative w-full max-w-[393px] h-[852px] bg-slate-900 rounded-[50px] overflow-hidden shadow-2xl border-[6px] border-zinc-800 flex flex-col justify-between font-sans viewfinder-bg">
<!-- Scenic mountain layers silhouette for viewfinder realism -->
<div class="absolute inset-0 pointer-events-none opacity-40 mix-blend-overlay flex flex-col justify-end">
<!-- Distant Peaks -->
<svg class="w-full text-slate-900/60 fill-current mb-[-30px]" viewbox="0 0 1440 320">
<path d="M0,192L96,160L192,224L288,128L384,192L480,96L576,160L672,64L768,192L864,128L960,224L1056,160L1152,192L1248,96L1344,192L1440,128L1440,320L0,320Z"></path>
</svg>
<!-- Mid-ground Ridge -->
<svg class="w-full text-emerald-950 fill-current" viewbox="0 0 1440 320">
<path d="M0,224L80,192L160,256L240,160L320,224L400,128L480,224L560,192L640,256L720,160L800,224L880,160L960,256L1040,192L1120,224L1200,160L1280,224L1360,192L1440,256L1440,320L0,320Z"></path>
</svg>
</div>
<!-- BEGIN: iOS Status Bar -->
<header class="relative z-30 pt-3 px-8 flex justify-between items-center text-white text-xs font-semibold tracking-tight" data-purpose="ios-status-bar">
<span class="text-sm font-medium tracking-normal">9:41</span>
<!-- iOS Notch / Dynamic Island Simulator -->
<div class="absolute left-1/2 -translate-x-1/2 top-2.5 w-28 h-6 bg-black rounded-full flex items-center justify-end pr-2 space-x-1.5">
<div class="w-2.5 h-2.5 rounded-full bg-slate-950 border border-zinc-800"></div>
</div>
<!-- System Icons: Signal, WiFi, Battery -->
<div class="flex items-center space-x-1.5 text-white">
<!-- Cellular Signal -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M2 17h3v4H2v-4zm5-4h3v8H7v-8zm5-4h3v12h-3V9zm5-4h3v16h-3V5z"></path>
</svg>
<!-- WiFi -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.78 0 7.21 1.5 9.73 3.94L12 18.25 2.27 11.44C4.79 9 8.22 7.5 12 7.5z"></path>
</svg>
<!-- Battery Level -->
<div class="flex items-center">
<div class="w-5 h-2.5 border border-white rounded-[3px] p-0.5 flex items-center">
<div class="h-full w-full bg-white rounded-[1px]"></div>
</div>
<div class="w-0.5 h-1 bg-white rounded-r-sm -ml-[0.5px]"></div>
</div>
</div>
</header>
<!-- END: iOS Status Bar -->
<!-- BEGIN: Top Floating Instruction Banner -->
<section class="relative z-20 px-4 pt-4" data-purpose="top-navigation-banner">
<div class="bg-black/40 backdrop-blur-md border border-white/10 rounded-2xl p-3 flex items-center shadow-lg">
<!-- Back Navigation Button -->
<button aria-label="Go back" class="w-9 h-9 rounded-full flex items-center justify-center text-white/90 hover:bg-white/10 active:scale-95 transition-all" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Instruction Text -->
<div class="flex-1 text-center pr-9">
<h1 class="text-[13px] leading-tight font-medium text-white/95">
            Take a photo at the location<br/>to verify your visit
          </h1>
</div>
</div>
</section>
<!-- END: Top Floating Instruction Banner -->
<!-- BEGIN: Viewport Center Framing Reticle -->
<section class="relative z-10 flex-1 flex items-center justify-center px-8 py-4" data-purpose="camera-framing-guide">
<!-- Minimalist Square/Rectangular Reticle Box -->
<div class="relative w-64 h-64 sm:w-72 sm:h-72 transition-all">
<!-- Reticle 4 Corner Marks -->
<span class="reticle-corner reticle-top-left"></span>
<span class="reticle-corner reticle-top-right"></span>
<span class="reticle-corner reticle-bottom-left"></span>
<span class="reticle-corner reticle-bottom-right"></span>
<!-- Center Crosshair Target -->
<div class="absolute inset-0 flex items-center justify-center opacity-40">
<div class="w-4 h-0.5 bg-white"></div>
<div class="h-4 w-0.5 bg-white -ml-2"></div>
</div>
<!-- Faint internal framing guideline -->
<div class="w-full h-full border border-white/15 rounded-lg"></div>
</div>
</section>
<!-- END: Viewport Center Framing Reticle -->
<!-- BEGIN: Bottom Controls & Status Area -->
<footer class="relative z-20 pb-8 px-5 flex flex-col items-center gap-5" data-purpose="bottom-interaction-panel">
<!-- BEGIN: Location Verification Pill Card -->
<aside class="w-full bg-[#f6f5ee]/95 backdrop-blur-md rounded-2xl p-3.5 shadow-2xl flex items-center space-x-3.5 border border-white/40" data-purpose="location-status-confirmation">
<!-- Green Verification Checkmark Icon -->
<div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center flex-shrink-0 text-white shadow-sm pulse-ring">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Status Message & GPS Accuracy -->
<div class="flex flex-col text-left">
<span class="text-[13px] font-semibold text-slate-800 tracking-tight leading-snug">Checking location...</span>
<span class="text-[11px] font-medium text-emerald-700 leading-snug">Within 50 meters</span>
</div>
</aside>
<!-- END: Location Verification Pill Card -->
<!-- BEGIN: Camera Shutter Controls Bar -->
<div class="w-full flex items-center justify-between px-6 pt-1" data-purpose="shutter-action-bar">
<!-- Left: Gallery Access Thumbnail Button -->
<button aria-label="Open photo library" class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/20 flex items-center justify-center text-white/90 hover:bg-black/60 active:scale-95 transition-all" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="18" rx="3" stroke-width="2" width="18" x="3" y="3"></rect>
<circle cx="8.5" cy="8.5" fill="currentColor" r="1.5"></circle>
<path d="M21 15l-5-5L5 21" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Center: Prominent Dual-Ring White Shutter Button -->
<button aria-label="Capture photo" class="group relative flex items-center justify-center active:scale-95 transition-transform duration-150" type="button">
<!-- Outer Ring -->
<div class="w-18 h-18 sm:w-20 sm:h-20 w-[74px] h-[74px] rounded-full border-[3px] border-white/90 flex items-center justify-center p-1 shadow-lg">
<!-- Inner Solid Shutter Circle -->
<div class="w-full h-full bg-white rounded-full transition-transform duration-100 group-hover:scale-95"></div>
</div>
</button>
<!-- Right: Camera Flip / Lens Switch Button -->
<button aria-label="Flip camera lens" class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/20 flex items-center justify-center text-white/90 hover:bg-black/60 active:scale-95 transition-all" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- END: Camera Shutter Controls Bar -->
<!-- iOS Home Bar Indicator -->
<div class="w-32 h-1 bg-white/60 rounded-full mt-2"></div>
</footer>
<!-- END: Bottom Controls & Status Area -->
</main>
<!-- END: Phone Mockup Container -->
</body></html>
