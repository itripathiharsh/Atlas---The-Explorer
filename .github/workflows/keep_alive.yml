name: Render 24/7 Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from idling
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          TARGET="${{ secrets.BACKEND_URL }}"
          if [ -z "$TARGET" ]; then
            TARGET="https://atlas-backend-6oqp.onrender.com"
          fi
          echo "Pinging $TARGET/health ..."
          curl -s -f "$TARGET/health" || echo "Ping attempt completed"
