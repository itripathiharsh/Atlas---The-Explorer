name: Render 24/7 Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from idling
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          if [ -n "${{ secrets.BACKEND_URL }}" ]; then
            echo "Pinging ${{ secrets.BACKEND_URL }}/health ..."
            curl -s -f "${{ secrets.BACKEND_URL }}/health" || echo "Ping attempt completed"
          else
            echo "BACKEND_URL secret not configured yet. Skipping ping."
          fi
